<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a0b3d"/>
      <stop offset="0.5" stop-color="#5b1fa8"/>
      <stop offset="1" stop-color="#ff3d7f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.46" r="0.5">
      <stop offset="0" stop-color="#ffb347" stop-opacity="0.75"/>
      <stop offset="0.55" stop-color="#ff3d7f" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#ff3d7f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bubble" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffd9ec"/>
    </linearGradient>
    <linearGradient id="play" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7a2ff0"/>
      <stop offset="1" stop-color="#ff3d7f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="26" stdDeviation="30" flood-color="#14052e" flood-opacity="0.55"/>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="2"/></filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>

  <!-- Sparkle dots -->
  <g fill="#ffffff" opacity="0.7">
    <circle cx="140" cy="160" r="6"/><circle cx="880" cy="130" r="9"/><circle cx="930" cy="560" r="5"/>
    <circle cx="96" cy="640" r="7"/><circle cx="200" cy="880" r="5"/><circle cx="860" cy="880" r="8"/>
    <circle cx="520" cy="96" r="4"/>
  </g>

  <!-- Sound waves -->
  <g stroke-linecap="round" stroke-width="28">
    <path d="M46 435 V505" stroke="#ffb347" opacity="1"/>
    <path d="M978 435 V505" stroke="#ffb347" opacity="1"/>
    <path d="M92 380 V560" stroke="#ffffff" opacity="0.8"/>
    <path d="M932 380 V560" stroke="#ffffff" opacity="0.8"/>
    <path d="M138 325 V615" stroke="#ffffff" opacity="1"/>
    <path d="M886 325 V615" stroke="#ffffff" opacity="1"/>
  </g>

  <!-- Speech bubble -->
  <g filter="url(#shadow)">
    <path d="M512 170
             C 740 170 862 290 862 470
             C 862 650 740 770 512 770
             C 470 770 432 765 398 756
             L 270 846
             C 252 858 232 846 238 824
             L 268 712
             C 192 650 162 566 162 470
             C 162 290 284 170 512 170 Z" fill="url(#bubble)"/>
  </g>

  <!-- Play button -->
  <path d="M440 330 L440 610 Q440 640 466 626 L690 496 Q714 482 690 468 L466 316 Q440 300 440 330 Z"
        fill="url(#play)" transform="translate(6 6)"/>

  <!-- Bubble highlight -->
  <path d="M300 300 C 340 240 420 205 512 205" fill="none" stroke="#ffffff" stroke-width="14"
        stroke-linecap="round" opacity="0.85" filter="url(#soft)"/>
</svg>
